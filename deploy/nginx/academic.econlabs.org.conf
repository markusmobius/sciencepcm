# EconMCP - OpenAlex search over OpenSearch (repo: newsprinceton/OpenAlexMcp).
#
# The server runs on this host, listening on 127.0.0.1:9500. nginx only terminates TLS
# and proxies; it does not touch auth.
#
# NO CORS HEADERS HERE ON PURPOSE. OpenAlexMcp.Server sets them itself
# (AllowAnyOrigin + WithExposedHeaders("Mcp-Session-Id")) and nginx passes them through.
# Adding them here as well would send Access-Control-Allow-Origin twice, which browsers
# reject outright.
#
# Auth is an API key checked by the app: x-api-key or Authorization: Bearer <key>,
# against the MCP_API_KEY environment variable.
#
# Install:
#   sudo cp academic.econlabs.org.conf /etc/nginx/sites-available/academic
#   sudo ln -s /etc/nginx/sites-available/academic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.academic.econlabs.org

server {
    listen 443 ssl;
    server_name www.academic.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.academic.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.academic.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /mcp {
        proxy_pass http://localhost:9500/mcp;

        # REQUIRED FOR MCP SSE TRANSPORT:
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        # OpenSearch queries are quick, but the stream stays open for the session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
