# EconMCP (OpenAlex search) - existing vhost, with CORS added.
#
# Browsers refuse cross-origin calls unless the server says otherwise, so the MCP
# console at www.mcptest.econlabs.org cannot reach this without the headers below.
# The allowlist is explicit: a wildcard would let any site on the internet make
# authenticated calls using a visitor's stored token.
#
# Install:
#   sudo cp academic.econlabs.org.conf /etc/nginx/sites-available/academic
#   sudo ln -s /etc/nginx/sites-available/academic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_origin $econmcp_cors {
    default "";
    "https://www.mcptest.econlabs.org" $http_origin;
    "http://localhost:5173"            $http_origin;
}

server {
    listen 443 ssl;
    server_name www.academic.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.academic.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.academic.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /mcp {
        # Preflight never carries credentials, so it must be answered before the
        # upstream sees it - otherwise the 401 stops the real request being sent.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $econmcp_cors always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Mcp-Session-Id, x-api-key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        add_header Access-Control-Allow-Origin $econmcp_cors always;
        # MCP carries its session in a custom header, which script cannot read unless
        # it is named here.
        add_header Access-Control-Expose-Headers "Mcp-Session-Id" always;

        proxy_pass http://localhost:9500/mcp;

        # REQUIRED FOR MCP SSE TRANSPORT:
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}
