# OpenAlex MCP endpoint. The A100 reverse tunnel maps local 8081 to relay 9202.
#
# Install:
#   sudo cp openalexmcp.econlabs.org.conf /etc/nginx/sites-available/openalexmcp
#   sudo ln -s /etc/nginx/sites-available/openalexmcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.openalexmcp.econlabs.org

server {
    listen 443 ssl;
    server_name www.openalexmcp.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.openalexmcp.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.openalexmcp.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /mcp {
        proxy_pass http://localhost:9202/mcp;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://localhost:9202/health;
    }
}