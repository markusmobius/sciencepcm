server {
    listen 443 ssl;
    server_name www.custommcp.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.custommcp.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.custommcp.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /mcp {
        proxy_pass http://localhost:9204;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://localhost:9204/health;
    }
}