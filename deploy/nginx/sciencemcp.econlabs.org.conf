# Production MCP endpoint.
#
# The GPU box is not reachable from the internet, so tools/mcp-tunnel.sh holds a reverse
# SSH tunnel that makes the server appear on 127.0.0.1:9201 here. nginx terminates TLS
# and proxies to it; the port itself is never exposed.
#
# NO CORS HEADERS HERE ON PURPOSE. SciencePcm.Server sets them itself from its
# --cors-origins argument, and nginx passes them through. Adding them here as well would
# send Access-Control-Allow-Origin twice, which browsers reject outright.
# (EconMCP is the other way round - we do not control its code, so its vhost adds them.)
#
# Install:
#   sudo cp sciencemcp.econlabs.org.conf /etc/nginx/sites-available/sciencemcp
#   sudo ln -s /etc/nginx/sites-available/sciencemcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.sciencemcp.econlabs.org

server {
    listen 443 ssl;
    server_name www.sciencemcp.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.sciencemcp.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sciencemcp.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /mcp {
        proxy_pass http://localhost:9201/mcp;

        # REQUIRED FOR MCP SSE TRANSPORT:
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        # Reranking runs well past nginx's 60s default read timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No auth on this one, so it distinguishes "unreachable" from "wrong token".
    location /health {
        proxy_pass http://localhost:9201/health;
    }
}
