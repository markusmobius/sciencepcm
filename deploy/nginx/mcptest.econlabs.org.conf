# MCP test console (src/SciencePcm.Inspector), served from this host.
#
# Not tunnelled: the console runs here, on 127.0.0.1:6671. It serves static files at /
# and relays MCP calls through /proxy, so the whole site is forwarded rather than a
# single path.
#
# Run the console with:
#   dotnet SciencePcm.Inspector.dll --urls http://localhost:6671
#
# Install:
#   sudo cp mcptest.econlabs.org.conf /etc/nginx/sites-available/mcptest
#   sudo ln -s /etc/nginx/sites-available/mcptest /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.mcptest.econlabs.org

server {
    listen 443 ssl;
    server_name www.mcptest.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.mcptest.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mcptest.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://localhost:6671;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # /proxy relays MCP calls, and a reranked search takes seconds. Buffering would
        # also stall SSE responses until the stream closed.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
