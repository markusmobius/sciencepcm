# Staging MCP endpoint, for trying changes without disturbing production.
#
# Unlike the production vhost this is NOT tunnelled: the test server runs directly on
# this host, listening on 127.0.0.1:6671.
#
# Install:
#   sudo cp mcptest.econlabs.org.conf /etc/nginx/sites-available/mcptest
#   sudo ln -s /etc/nginx/sites-available/mcptest /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.mcptest.econlabs.org

server {
    listen 443 ssl;
    server_name www.mcptest.econlabs.org;

    ssl_certificate /etc/letsencrypt/live/www.mcptest.econlabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mcptest.econlabs.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /mcp {
        proxy_pass http://localhost:6671/mcp;

        # REQUIRED FOR MCP SSE TRANSPORT:
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://localhost:6671/health;
    }
}
